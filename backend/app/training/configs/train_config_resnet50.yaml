# TruthLens Training Configuration - ResNet50
# ==========================================
# Training configuration for ResNet50 on CIFAKE (identical settings to EfficientNet-B4)

# Experiment Configuration
experiment:
  base_dir: experiments
  name: cifake_resnet50
  validate_data: true
  save_validation_report: true
  save_history: true
  save_plots: true

# Model Configuration
model:
  architecture: resnet50
  num_classes: 2
  pretrained: true
  dropout: 0.3
  freeze_backbone: false

# Data Configuration
data:
  train_metadata: backend/TruthLensDataset/metadata.csv
  val_metadata: backend/TruthLensDataset/metadata.csv
  dataset_dir: backend/TruthLensDataset
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  augment: true
  balanced_sampling: true
  samples_per_generator: null

# Training Configuration
training:
  epochs: 50
  seed: 42
  deterministic: false
  
  # Optimizer Configuration
  optimizer:
    type: adamw
    lr: 0.0001
    weight_decay: 0.01
  
  # Learning Rate Scheduler
  scheduler:
    type: cosine
  
  # Mixed Precision Training
  mixed_precision: true
  
  # Checkpoint Configuration
  save_best_only: true
  max_checkpoints: 3
  resume: false
  
  # Early Stopping
  early_stopping:
    enabled: true
    patience: 7
    min_delta: 0.001
  
  # TensorBoard Logging
  use_tensorboard: true
