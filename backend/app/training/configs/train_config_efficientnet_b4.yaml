# TruthLens Training Configuration - EfficientNet-B4

experiment:
  base_dir: experiments
  name: cifake_efficientnet_b4_baseline
  validate_data: true
  save_validation_report: true
  save_history: true
  save_plots: true

model:
  architecture: efficientnet_b4
  num_classes: 2
  pretrained: true
  dropout: 0.3
  freeze_backbone: false

data:
  train_metadata: TruthLensDataset/metadata.csv
  val_metadata: TruthLensDataset/metadata.csv
  dataset_dir: TruthLensDataset
  image_size: 224

  # Increase only if your GPU has enough memory
  batch_size: 48

  num_workers: 6
  pin_memory: true
  augment: true

  # Keep disabled because you already removed the sampler
  balanced_sampling: false
  samples_per_generator: null

training:
  epochs: 20

  seed: 42
  deterministic: false

  optimizer:
    type: adamw
    lr: 0.0001
    weight_decay: 0.01

  scheduler:
    type: cosine

  mixed_precision: true

  save_best_only: true
  max_checkpoints: 3
  resume: false

  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.0005

  use_tensorboard: true