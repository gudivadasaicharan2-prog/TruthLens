# TruthLens Test Configuration
# ==============================
# Configuration for testing AI content detection models

# Model Configuration
model:
  architecture: efficientnet_b4  # Options: efficientnet_b4, convnext_tiny, resnet50
  num_classes: 2  # Binary classification (real vs AI)

# Data Configuration
data:
  test_metadata: TruthLensDataset/metadata.csv  # Path to test metadata
  dataset_dir: TruthLensDataset  # Base directory containing images
  image_size: 224  # Input image size
  batch_size: 32  # Batch size for testing
  num_workers: 4  # Number of data loading workers
  pin_memory: true  # Pin memory for faster GPU transfer

# Test Configuration
test:
  checkpoint_path: experiments/experiment_001/checkpoints/best_model.pth  # Path to model checkpoint
  return_probs: true  # Return prediction probabilities
  save_predictions: true  # Save predictions to JSON
  save_metrics: true  # Save metrics to JSON
  predictions_output: test_predictions.json  # Path to save predictions
  metrics_output: test_metrics.json  # Path to save metrics
